name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release (e.g. v0.0.1)
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish GitHub Release (not Play Store)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses > /dev/null

      - name: Install SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.3.13750724" "cmake;3.22.1"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify
        run: ./gradlew test assembleDebug --no-daemon

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/origin-agent-${{ github.ref_name }}.apk
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
          cat dist/SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
          body: |
            ## Origin Agent ${{ github.event.inputs.tag || github.ref_name }}

            **Universal intelligence. Trustworthy execution. Human empowerment.**

            - Native Android app. Offline-first. No account, telemetry, ads or mandatory cloud.
            - Distributed on GitHub Releases only — **not on the Google Play Store**.
            - Verify the APK with `sha256sum -c SHA256SUMS.txt` before installing.

            See `CHANGELOG.md` for details.
