name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release (e.g. v0.0.1)
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish GitHub Release (not Play Store)
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Android SDK
        run: |
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          echo "$sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$sdk/platform-tools" >> "$GITHUB_PATH"

      - name: Accept SDK licenses
        run: |
          set +o pipefail
          yes | sdkmanager --licenses > /dev/null

      - name: Install SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.3.13750724" "cmake;3.22.1"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify
        run: bash ./gradlew test assembleRelease --no-daemon

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/origin-agent-${RELEASE_TAG}.apk
          # Checksum only the APK built for this tag; archived older APKs may be
          # local (skipNative) builds and must not be mistaken for release artifacts.
          sha256sum dist/origin-agent-${RELEASE_TAG}.apk > dist/SHA256SUMS.txt
          cat dist/SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            dist/origin-agent-${{ env.RELEASE_TAG }}.apk
            dist/SHA256SUMS.txt
          body: |
            ## Origin Agent ${{ env.RELEASE_TAG }}

            **Universal intelligence. Trustworthy execution. Human empowerment.**

            - Native Android app. Offline-first. No account, telemetry, ads or mandatory cloud.
            - Five real downloadable AI models: SmolLM2 135M starter, BitNet b1.58 2B4T, LFM2.5 350M, SmolLM2 360M and Qwen2.5 0.5B, plus compatible GGUF import and memory-aware suggestions. Chat requires a verified local GGUF or a real configured endpoint; rules never imitate a model.
            - Distributed on GitHub Releases only — **not on the Google Play Store**.
            - Verify the APK with `sha256sum -c SHA256SUMS.txt` before installing.

            See `CHANGELOG.md` for details.
