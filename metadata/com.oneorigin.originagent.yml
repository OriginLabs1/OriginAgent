Summary: Universal, sovereign, model-agnostic intelligent agent environment
Description: |
  Origin Agent is a native Android intelligent agent environment that keeps user data
  local and routes consequential actions through an inspectable plan → authorization →
  verification → provenance pipeline. Chat uses only real AI models: four downloadable,
  checksum-verified local GGUFs run on-device through llama.cpp, or a user-configured
  OpenAI-compatible adapter. Rules-based tools never imitate conversation. Calculator,
  date/time, notes, knowledge search and the trust ledger work offline. No account,
  telemetry, ads or mandatory cloud are required.
