Summary: Universal, sovereign, model-agnostic intelligent agent environment
Description: |
  Origin Agent is a native Android intelligent agent environment that works offline,
  keeps user data local, and routes consequential actions through an inspectable
  plan → authorization → verification → provenance pipeline. It includes deterministic
  tools (calculator, date/time, notes, knowledge search) and optional model adapters.
  No account, telemetry, ads or mandatory cloud are required.
