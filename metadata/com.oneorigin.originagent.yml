Summary: Universal, sovereign, model-agnostic intelligent agent environment
Description: |
  Origin Agent is a native Android intelligent agent environment that keeps user data
  local and routes consequential actions through an inspectable plan → authorization →
  verification → provenance pipeline. Chat uses only real AI models: five downloadable,
  checksum-verified local GGUFs and compatible imported GGUFs run on-device through llama.cpp,
  or a user-configured OpenAI-compatible adapter that must be explicitly configured and selected.
  Rules-based
  tools never imitate conversation. Calculator, date/time, notes, knowledge search, a local
  task/channel workspace, editable draft pages and the trust ledger work offline. Optional
  voice dictation uses the platform speech recogniser only after a tap. No account, telemetry,
  ads or mandatory cloud are required.
